<div class="flex items-end gap-2">
  <textarea
    rows="4"
    cols="30"
    pTextarea
    placeholder="Your answer"
    [(ngModel)]="currentAnswer"
    (ngModelChange)="this.answered.emit(this.currentAnswer);"
  ></textarea>

  @if (answers[0].isFlag && isAdmin) {
  <span class="bg-gray-200 ml-2 text-sm p-1 text-black/90">{{ answers[0].points }}pt</span>
  }
</div>
