<div class="flex align-items-end gap-2">
  <textarea
    rows="4"
    cols="30"
    pTextarea
    placeholder="Your answer"
    [(ngModel)]="enteredValue"
    (ngModelChange)="answered.emit($event)"
  ></textarea>

  @if (answers[0].isFlag && showFlag) {
  <span class="bg-gray-200 ml-2 text-sm p-1 text-black-alpha-90">{{ answers[0].points }}pt</span>
  }
</div>
