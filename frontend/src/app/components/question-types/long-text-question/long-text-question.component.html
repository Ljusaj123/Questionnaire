<div class="flex items-end gap-2">
  <textarea
    rows="4"
    cols="30"
    pTextarea
    placeholder="Your answer"
    [(ngModel)]="selectedAnswer"
    (ngModelChange)="setAnswerValues($event)"
  ></textarea>

  @if (answers()[0].points && isAdmin()) {
  <span class="bg-gray-200 ml-2 text-sm p-1 text-black/90 mb-1">{{ answers()[0].points }}pt</span>
  }
</div>
