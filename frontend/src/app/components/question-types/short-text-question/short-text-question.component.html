<div class="flex align-items-end gap-2">
  <input
    pInputText
    placeholder="Your answer"
    type="text"
    [(ngModel)]="currentAnswer"
    (ngModelChange)="this.answered.emit(this.currentAnswer);"
  />

  @if (answers[0].isFlag && isAdmin) {
    <span class="bg-gray-200 ml-2 text-sm p-1 text-black-alpha-90"
      >{{ answers[0].points }}pt</span
    >
  }
</div>
