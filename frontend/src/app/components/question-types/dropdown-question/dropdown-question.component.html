<p-select
  placeholder="Select an option"
  [options]="answers()"
  [(ngModel)]="selectedAnswer"
  optionLabel="label"
  optionValue="label"
  (ngModelChange)="setAnswerValues($event)"
  appendTo="body"
>
  <ng-template pTemplate="item" let-answer>
    <span>{{ answer.label }}</span>

    @if (answer.points && isAdmin()) {
      <span class="bg-gray-200 ml-2 text-sm p-1 text-black/90 mb-1">
        {{ answer.points }}pt
      </span>
    }
  </ng-template>
</p-select>
